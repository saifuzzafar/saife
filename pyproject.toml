[project]
name = "saife-capstone"
version = "0.1.0"
description = "SAIFE - Secure AI Framework for Everyone (Capstone)"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai>=1.0.0",
    "pydantic-evals>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "click>=8.0",
    "rich>=13.0",
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0",
    "fastmcp>=3.3.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "openinference-instrumentation-pydantic-ai>=0.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
